[package]
name = "warp_browser_mcp"
edition = "2024"
description = "Stdio MCP server that lets an agent drive Warp's browser underlay over local control"
authors.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "warp-browser-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
local_control.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
warp_core = { path = "../warp_core" }
